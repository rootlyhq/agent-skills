name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact squash-merged release commit on main
        required: true
        type: string
      expected_archive_sha256:
        description: SHA-256 of the exact exported ZIP reviewed for release
        required: true
        type: string
      expected_microsoft_archive_sha256:
        description: SHA-256 of the exact Microsoft ZIP reviewed for release
        required: true
        type: string
      fidelity_reviewed:
        description: Current fidelity matrix and manual semantic review passed for this candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify explicit review and immutable candidate
        id: candidate
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          FIDELITY_REVIEWED: ${{ inputs.fidelity_reviewed }}
        run: |
          test "$FIDELITY_REVIEWED" = true
          python tools/scripts/verify_release_candidate.py "$CANDIDATE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m ruff check tools
      - run: python tools/scripts/check_release_metadata.py --released --tag "$TAG"
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
      - run: python tools/scripts/check_commit_messages.py --release "$TAG"
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
      - run: python tools/scripts/check_public_tree.py --require-private-markers
        env:
          ROOTLY_SKILLS_PRIVATE_MARKERS: ${{ secrets.ROOTLY_SKILLS_PRIVATE_MARKERS }}
      - run: python tools/scripts/build_package.py --check
      - run: python tools/scripts/validate_skills.py
      - run: python -m unittest discover -s tools/tests/static -v
      - run: python tools/scripts/export_release.py > export.json
      - name: Assemble approved assets and release notes
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
        run: |
          python tools/scripts/prepare_release_assets.py "$TAG" "$EXPECTED_SHA256"
          # Local only: notes compare the candidate against the previous tag.
          git show-ref --verify --quiet "refs/tags/$TAG" || git tag "$TAG"
      - name: Prepare reviewed Microsoft package
        env:
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
          EXPECTED_MICROSOFT_SHA256: ${{ inputs.expected_microsoft_archive_sha256 }}
        run: |
          python tools/scripts/build_microsoft_package.py --export export.json --tag "$TAG" --candidate "$CANDIDATE" --output release/microsoft --expected-sha256 "$EXPECTED_MICROSOFT_SHA256"
          python tools/scripts/release_notes.py --tag "$TAG" --archive "release/rootly-$TAG.zip" --microsoft-archive "release/microsoft/rootly-microsoft-$TAG.zip" > release/notes.md
      - name: Prepare marketplace submission bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          catalog_commit=$(gh api repos/anthropics/claude-plugins-official/commits/main --jq .sha)
          gh api "repos/anthropics/claude-plugins-official/contents/.claude-plugin/marketplace.json?ref=$catalog_commit" --jq '.content|@base64d' > catalog.json
          python tools/scripts/prepare_marketplace_bundle.py --export export.json --tag "$TAG" --candidate "$CANDIDATE" --catalog catalog.json --catalog-commit "$catalog_commit" --output release/marketplaces --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: approved-release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Publish immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CANDIDATE: ${{ needs.prepare.outputs.sha }}
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
          EXPECTED_MICROSOFT_SHA256: ${{ inputs.expected_microsoft_archive_sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" "release/rootly-$TAG.zip" | sha256sum --check
          printf '%s  %s\n' "$EXPECTED_MICROSOFT_SHA256" "release/microsoft/rootly-microsoft-$TAG.zip" | sha256sum --check
          (cd release/marketplaces && sha256sum --check "rootly-marketplaces-$TAG.zip.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$CANDIDATE"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "$TAG" "$CANDIDATE"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" "release/rootly-$TAG.zip" "release/rootly-$TAG.zip.sha256" release/release-inventory.json "release/marketplaces/rootly-marketplaces-$TAG.zip" "release/marketplaces/rootly-marketplaces-$TAG.zip.sha256" "release/microsoft/rootly-microsoft-$TAG.zip" "release/microsoft/rootly-microsoft-$TAG.zip.sha256" "release/microsoft/rootly-microsoft-$TAG-inventory.json" --title "$TAG" --notes-file release/notes.md --verify-tag
          gh label create autorelease:tagged --color ededed --force
          for pr_number in $(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE/pulls" --jq '.[] | select(.merged_at != null and (.head.ref | startswith("release-please--"))) | .number'); do
            gh pr edit "$pr_number" --remove-label autorelease:pending --add-label autorelease:tagged
          done
      # No tag-push publishing, live MCP calls or marketplace submission.
