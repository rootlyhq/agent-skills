name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # release notes diff against the previous tag
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m ruff check tools
      # Refuse before producing anything if the tag and the changelog disagree with VERSION.
      - run: python tools/scripts/check_release_metadata.py --released --tag "$GITHUB_REF_NAME"
      - run: python tools/scripts/check_commit_messages.py --release "$GITHUB_REF_NAME"
      - run: python tools/scripts/check_public_tree.py --require-private-markers
        env:
          ROOTLY_SKILLS_PRIVATE_MARKERS: ${{ secrets.ROOTLY_SKILLS_PRIVATE_MARKERS }}
      - run: python tools/scripts/build_package.py --check
      - run: python tools/scripts/validate_skills.py
      - run: python -m unittest discover -s tools/tests/static -v
      - run: python tools/scripts/export_release.py > export.json
      - name: Name the package after the tag
        run: |
          archive="$(python -c 'import json; print(json.load(open("export.json"))["archive"])')"
          directory="$(python -c 'import json; print(json.load(open("export.json"))["directory"])')"
          mkdir release
          cp "$archive" "release/rootly-$GITHUB_REF_NAME.zip"
          cp "$directory/release-inventory.json" release/
          (cd release && sha256sum "rootly-$GITHUB_REF_NAME.zip" > "rootly-$GITHUB_REF_NAME.zip.sha256")
      - run: python tools/scripts/release_notes.py --tag "$GITHUB_REF_NAME" --archive "release/rootly-$GITHUB_REF_NAME.zip" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      # No model credentials, live MCP calls, or marketplace publication from CI.
      # The tag must already exist; this workflow never creates or moves one.
