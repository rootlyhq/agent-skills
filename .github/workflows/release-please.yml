name: Prepare release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          skip-github-release: true
      - name: Select prepared release branch
        id: pr
        env:
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: python tools/scripts/release_pr_branch.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.branch != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - name: Synchronize derived metadata
        if: steps.pr.outputs.branch != ''
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/scripts/prepare_release_pr.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          if ! git diff --cached --quiet; then
            git commit -m 'chore(release): synchronize derived metadata'
            git push
          fi
      - name: Validate the release PR head
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run validate.yml --ref "$RELEASE_BRANCH"
      # GITHUB_TOKEN does not trigger push/PR workflows. workflow_dispatch does.
      # This workflow never creates tags or GitHub releases.
