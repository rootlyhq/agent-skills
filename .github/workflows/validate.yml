name: Validate skills and release boundary

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # commit-message check reads the pushed range
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m ruff check tools
      - name: Check publication contents and commit messages
        env:
          ROOTLY_SKILLS_PRIVATE_MARKERS: ${{ secrets.ROOTLY_SKILLS_PRIVATE_MARKERS }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Unknown bases require the whole reachable publication history; only
          # the commit-message convention falls back to the head commit alone.
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD_SHA"; scan_range="$range"
          elif [ "$EVENT" = push ] && git merge-base --is-ancestor "$BEFORE" "$HEAD_SHA" 2>/dev/null; then range="$BEFORE..$HEAD_SHA"; scan_range="$range"
          else range="$HEAD_SHA^!"; scan_range="$HEAD_SHA"; fi
          python tools/scripts/check_public_tree.py --require-private-markers
          python tools/scripts/check_public_tree.py --range "$scan_range" --require-private-markers
          python tools/scripts/check_commit_messages.py "$range"
      - run: python tools/scripts/check_release_metadata.py
      - run: python tools/scripts/build_package.py --check
      - run: python tools/scripts/validate_skills.py
      - run: python -m unittest discover -s tools/tests/static -v
      - run: python tools/scripts/export_release.py
      # No model credentials, live MCP calls, uploads, or publication from CI.

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/scripts/build_package.py --check
      - run: python -m unittest discover -s tools/tests/static -v
