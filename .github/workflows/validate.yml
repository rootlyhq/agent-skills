name: Validate skills and release boundary

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # commit-message check reads the pushed range
      - name: Verify Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m ruff check tools
      - name: Check publication contents and commit messages
        env:
          ROOTLY_SKILLS_PRIVATE_MARKERS: ${{ secrets.ROOTLY_SKILLS_PRIVATE_MARKERS }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Unknown bases require the whole reachable publication history; only
          # the commit-message convention falls back to the head commit alone.
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD_SHA"; scan_range="$range"
          elif [ "$EVENT" = push ] && git merge-base --is-ancestor "$BEFORE" "$HEAD_SHA" 2>/dev/null; then range="$BEFORE..$HEAD_SHA"; scan_range="$range"
          else range="$HEAD_SHA^!"; scan_range="$HEAD_SHA"; fi
          python tools/scripts/check_public_tree.py --require-private-markers
          python tools/scripts/check_public_tree.py --range "$scan_range" --require-private-markers
          python tools/scripts/check_commit_messages.py "$range"
      - run: python tools/scripts/check_release_metadata.py
      - run: python tools/scripts/build_package.py --check
      - run: python tools/scripts/validate_skills.py
      - run: python -m unittest discover -s tools/tests/static -v
      - run: python tools/scripts/export_release.py
      # No model credentials, live MCP calls or publication from validation.

  marketplace-preview:
    name: Marketplace preparation preview
    needs: static
    if: >-
      startsWith(github.ref, 'refs/heads/release-please--') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/scripts/export_release.py > export.json
      - name: Prepare drafts from this exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          catalog_commit=$(gh api repos/anthropics/claude-plugins-official/commits/main --jq .sha)
          gh api "repos/anthropics/claude-plugins-official/contents/.claude-plugin/marketplace.json?ref=$catalog_commit" --jq '.content|@base64d' > catalog.json
          python tools/scripts/prepare_marketplace_bundle.py --export export.json --tag "v$(cat VERSION)" --candidate "$CANDIDATE" --catalog catalog.json --catalog-commit "$catalog_commit" --output marketplace --preview --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: marketplace-preparation
          path: |
            marketplace/rootly-marketplaces-*.zip
            marketplace/rootly-marketplaces-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # Preparation only: public catalog reads and artifact upload, no provider writes.

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/scripts/build_package.py --check
      - run: python -m unittest discover -s tools/tests/static -v
