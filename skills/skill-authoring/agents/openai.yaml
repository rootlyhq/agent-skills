interface:
  display_name: "Rootly Skill Authoring"
  short_description: "Draft and create AI skills inside Rootly"
  default_prompt: "Use $skill-authoring to help with this Rootly workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "rootly"
      description: "Rootly incident and on-call data"
      transport: "streamable_http"
      url: "https://mcp.rootly.com/mcp?toolsets=all&readonly=true"
policy:
  allow_implicit_invocation: true
